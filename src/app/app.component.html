<div class="subscription-notice" *ngIf="subscriptionNotice as notice" [class.urgent]="notice.tone === 'urgent'" [class.subscription-notice--admin-shell]="isAdminShellRoute()" role="alert">
  <strong>{{ notice.tone === 'urgent' ? '⚠️ Attenzione pagamento' : 'Promemoria abbonamento' }}</strong>
  <span>{{ notice.message }}</span>
  <button type="button" class="subscription-notice-close" (click)="dismissSubscriptionNotice()" aria-label="Nascondi avviso pagamento" title="Nascondi per questa sessione">×</button>
</div>
<div class="realtime-update-notice" *ngIf="realtimeSync.pendingChange$ | async" role="status">
  <span><strong>Aggiornamento disponibile.</strong> {{ realtimeNotice }}</span>
  <div>
    <button type="button" (click)="realtimeSync.applyPendingUpdate()">Aggiorna ora</button>
    <button type="button" class="realtime-update-notice__dismiss" (click)="realtimeSync.dismissPendingUpdate()" aria-label="Chiudi">×</button>
  </div>
</div>
<router-outlet></router-outlet>
<app-attachment-viewer></app-attachment-viewer>
<app-ai-assistant-widget *ngIf="showAiAssistant"></app-ai-assistant-widget>
