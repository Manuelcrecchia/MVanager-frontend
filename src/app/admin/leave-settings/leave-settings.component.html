<div class="standard-management-page">
  <header class="mv-entity-toolbar">
    <div class="mv-entity-toolbar__title">
      <h1>Impostazioni permessi e assenze</h1>
    </div>
    <div class="mv-entity-toolbar__controls"><button class="btn mv-toolbar-back" type="button" (click)="back()">&larr; Torna indietro</button></div>
  </header>
  <div class="container standard-management-page__narrow">

  <section class="admin-card">
    <div class="card-body p-4 text-center">
      <h3 class="fw-bold mb-2">Giorni minimi di preavviso</h3>
      <p class="text-muted small mb-4">
        Imposta il numero minimo di giorni richiesti per richiedere un permesso o un'assenza.
      </p>

      <div class="mb-3" style="max-width: 200px; margin-left: auto; margin-right: auto;">
        <label class="form-label fw-bold">Giorni minimi</label>
        <input
          class="form-control form-control-glass text-center"
          type="number"
          [(ngModel)]="limit"
          min="0"
          required
        />
      </div>

      <button type="button" class="btn btn-primary btn-round" (click)="saveLimit()">
        💾 Salva impostazione
      </button>

      <div *ngIf="message" class="mt-3" style="padding: 10px 14px; border-radius: var(--mv-radius-control); background: rgba(47,183,255,0.15); border: 1px solid rgba(47,183,255,0.4); font-weight: 700; color: var(--mv-ink);">
        {{ message }}
      </div>
    </div>
  </section>
</div>
</div>
