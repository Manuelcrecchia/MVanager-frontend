<div class="standard-management-page pdf-page">
  <header class="mv-entity-toolbar pdf-page-header">
    <div class="mv-entity-toolbar__title"><h1>{{ documentTitle || 'Documento PDF' }}</h1></div>
    <div class="mv-entity-toolbar__controls"><button type="button" class="btn mv-toolbar-back" (click)="back()">&larr; Torna indietro</button></div>
  </header>

  <div class="pdf-shell" [class.pdf-shell--mobile]="mobileWebPdfViewer" #pdfShell>
    <div *ngIf="loadingPdf" class="pdf-loading">
      Caricamento documento...
    </div>

    <ng-container *ngIf="pdfSrc && mobileWebPdfViewer" [ngTemplateOutlet]="customToolbar"></ng-container>

    <ngx-extended-pdf-viewer
      *ngIf="pdfSrc && !mobilePdfViewer"
      #pdfViewer
      class="ngx-extended-pdf-viewer pdf-viewer"
      [src]="pdfSrc"
      useBrowserLocale="true"
      backgroundColor="var(--mv-surface)"
      [height]="'100%'"
      [customToolbar]="customToolbar"
      [filenameForDownload]="downloadName"
      [showSidebarButton]="false"
      [sidebarVisible]="false"
      [pageViewMode]="'multiple'"
      [scrollMode]="0"
      [spread]="'off'"
      [zoom]="pdfZoom"
      [minZoom]="0.5"
      [maxZoom]="maxPdfZoom"
      (currentZoomFactor)="onPdfZoomFactorChange($event)"
    >
    </ngx-extended-pdf-viewer>

    <app-mobile-pdf-viewer
      *ngIf="pdfSrc && mobileWebPdfViewer"
      class="mobile-pdf-viewer"
      [src]="pdfSrc"
      [page]="mobilePdfPage"
      [style.width.%]="currentPdfZoom * 100"
      [style.transform]="'scale(' + mobilePinchPreview + ')'"
      [style.transform-origin]="mobilePinchOrigin"
      (loaded)="onMobilePdfLoaded($event)"
      (download)="downloadPdf()"
    ></app-mobile-pdf-viewer>

    <div *ngIf="pdfSrc && nativeIosPdfViewer" class="native-pdf-placeholder">
      <span>Il documento viene visualizzato con il lettore PDF nativo di iPhone.</span>
      <button type="button" class="btn btn-pdf-action btn-sky" (click)="openNativePdf()" [disabled]="nativePdfOpening">
        {{ nativePdfOpening ? 'Apertura...' : 'Apri il PDF' }}
      </button>
    </div>
  </div>

  <div class="confirm-panel" *ngIf="confirmCustomerMode && pdfSrc">
    <button
      type="button"
      class="btn btn-confirm-customer"
      (click)="confirmAndCreateCustomer()"
    >
      <i class="fas fa-check-double me-2"></i>
      Conferma e crea cliente
    </button>
  </div>

  <div class="confirm-panel" *ngIf="confirmEmployeeMode && pdfSrc">
    <button
      type="button"
      class="btn btn-confirm-customer"
      (click)="confirmAndCreateEmployee()"
    >
      <i class="fas fa-user-plus me-2"></i>
      Verifica e crea dipendente
    </button>
  </div>

  <ng-template #customToolbar>
    <div class="pdf-toolbar">
      <div class="pdf-toolbar-left">
        <span class="pdf-toolbar-title">
          {{ documentTitle }}
        </span>
      </div>

      <div class="pdf-toolbar-actions">
        <div *ngIf="mobilePdfViewer && mobilePdfPages > 1" class="pdf-page-actions" aria-label="Pagine PDF">
          <button type="button" class="btn-pdf-page" (click)="changeMobilePdfPage(-1)" [disabled]="mobilePdfPage <= 1" aria-label="Pagina precedente">‹</button>
          <span>{{ mobilePdfPage }} / {{ mobilePdfPages }}</span>
          <button type="button" class="btn-pdf-page" (click)="changeMobilePdfPage(1)" [disabled]="mobilePdfPage >= mobilePdfPages" aria-label="Pagina successiva">›</button>
        </div>

        <div class="pdf-zoom-actions" aria-label="Controlli zoom PDF">
          <button type="button" class="btn-pdf-zoom" (click)="zoomPdf(-1)" aria-label="Riduci zoom">−</button>
          <button type="button" class="btn-pdf-zoom pdf-zoom-value" (click)="resetPdfZoom()" aria-label="Adatta alla larghezza">
            {{ pdfZoomLabel }}
          </button>
          <button type="button" class="btn-pdf-zoom" (click)="zoomPdf(1)" aria-label="Aumenta zoom">+</button>
        </div>

        <button type="button" mat-raised-button class="btn-pdf-action btn-sky" (click)="printPdf()">
          🖨️ Stampa
        </button>

        <button type="button" mat-raised-button class="btn-pdf-action btn-orange" (click)="downloadPdf()">
          ⬇️ Scarica
        </button>
      </div>
    </div>
  </ng-template>
</div>
