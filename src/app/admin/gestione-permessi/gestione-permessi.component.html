<div class="bg-light permissions-page">
  <header class="mv-entity-toolbar">
    <div class="mv-entity-toolbar__title">
      <h1>Permessi</h1>
      <button type="button" class="btn mv-toolbar-back mv-mobile-home-back" (click)="goBack()">← Torna indietro</button>
      <button type="button" class="btn mv-toolbar-primary" (click)="openCreaModal()">
        <i class="fas fa-plus" aria-hidden="true"></i> Nuovo
      </button>
    </div>
    <div class="mv-entity-toolbar__controls">
      <label class="permission-search-field">
        <span class="visually-hidden">Cerca permesso</span>
        <i class="fas fa-search" aria-hidden="true"></i>
        <input class="form-control" type="search" [(ngModel)]="search" placeholder="ID, dipendente, categoria o stato" />
      </label>
      <span class="mv-entity-toolbar__count">{{ filteredRequests.length }} / {{ leaveRequests.length }}</span>
      <button type="button" class="btn btn-light btn-sm" *ngIf="search" (click)="search = ''">Pulisci</button>
      <button type="button" class="btn btn-light btn-sm" (click)="toggleShowArchived()">
        {{ showArchived ? 'Nascondi archivio' : 'Mostra archivio' }}
      </button>
    </div>
  </header>

  <div class="container">
    <div *ngIf="loading" class="alert alert-info text-center">Caricamento...</div>
    <div *ngIf="!loading && filteredRequests.length === 0" class="alert alert-light border">
      {{ showArchived ? 'Nessun permesso trovato.' : 'Nessuna richiesta di permesso in attesa.' }}
    </div>

    <div class="permission-card-list" *ngIf="!loading && filteredRequests.length > 0">
      <article class="permission-card" [class.permission-card--open]="isRequestOpen(request.id)" *ngFor="let request of filteredRequests">
        <div class="permission-header-layout">
          <button type="button" class="permission-header-btn" (click)="toggleRequest(request.id)">
            <span class="permission-title">
              <span class="permission-id">#{{ request.displayId || (request.employeeId + '/' + request.id) }}</span>
              <span class="permission-name">{{ employeeName(request) }}</span>
              <span class="badge bg-warning text-dark" *ngIf="request.status === 'in attesa'">In attesa</span>
              <span class="badge bg-success" *ngIf="request.status === 'accettato'">Accettato</span>
              <span class="badge bg-danger" *ngIf="request.status === 'rifiutato'">Rifiutato</span>
              <span class="badge bg-warning text-dark" *ngIf="request.status === 'modificato'">Da confermare</span>
            </span>
            <span class="chev" [class.chev--open]="isRequestOpen(request.id)">▾</span>
          </button>

          <span class="permission-quick-actions">
            <button type="button" class="btn btn-sm permission-quick-button action-with-tooltip" (click)="openRequestSheet(request)" aria-label="Scheda permesso" data-tooltip="Scheda permesso">
              <i class="fas fa-id-card"></i>
            </button>
          </span>
        </div>

        <div class="mv-record-actions" *ngIf="isRequestOpen(request.id) && request.status === 'in attesa'">
          <div class="mv-record-actions__inner">
            <button type="button" class="btn mv-record-action mv-record-action--success action-with-tooltip" (click)="confirmAcceptDirect(request)" aria-label="Accetta permesso" data-tooltip="Accetta permesso">
              <i class="fas fa-check"></i>
            </button>
            <button type="button" class="btn mv-record-action mv-record-action--danger action-with-tooltip" (click)="rifiuta(request.id)" aria-label="Rifiuta permesso" data-tooltip="Rifiuta permesso">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>

<div #creaModal class="modal fade" tabindex="-1" aria-labelledby="creaModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="creaModalLabel">Nuovo permesso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Dipendente *</label>
          <select class="form-select" [(ngModel)]="creaData.employeeId">
            <option value="">Seleziona dipendente...</option>
            <option *ngFor="let emp of employees" [value]="emp.id">{{ emp.nome }} {{ emp.cognome }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Categoria *</label>
          <select class="form-select" [(ngModel)]="creaData.categoria">
            <option *ngFor="let categoria of categoriePermesso" [value]="categoria.key">{{ categoria.label }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Tipo *</label>
          <select class="form-select" [(ngModel)]="creaData.tipoPermesso" (change)="onCreaTipoChange()">
            <option value="giornaliero">Giornaliero</option>
            <option value="settimanale">Settimanale (più giorni)</option>
            <option value="parziale">Parziale (ore specifiche)</option>
          </select>
        </div>

        <div class="row g-2 mb-3">
          <div [class]="creaData.tipoPermesso === 'settimanale' ? 'col-6' : 'col-12'">
            <label class="form-label">{{ creaData.tipoPermesso === 'settimanale' ? 'Data inizio *' : 'Data *' }}</label>
            <input type="date" class="form-control" [(ngModel)]="creaData.fromDate" (change)="onCreaFromDateChange()" />
          </div>
          <div class="col-6" *ngIf="creaData.tipoPermesso === 'settimanale'">
            <label class="form-label">Data fine *</label>
            <input type="date" class="form-control" [(ngModel)]="creaData.toDate" />
          </div>
        </div>

        <div class="mb-3" *ngIf="creaData.tipoPermesso !== 'parziale'">
          <label class="form-label">Ore giornaliere <span class="text-muted small">(facoltativo)</span></label>
          <input type="number" class="form-control" min="0" max="24" step="0.5" [(ngModel)]="creaData.oreGiornaliere" placeholder="es. 8" />
        </div>

        <div class="row g-2 mb-2" *ngIf="creaData.tipoPermesso === 'parziale'">
          <div class="col-6">
            <label class="form-label">Ora inizio *</label>
            <input type="time" class="form-control" [(ngModel)]="creaData.oraInizio" />
          </div>
          <div class="col-6">
            <label class="form-label">Ora fine *</label>
            <input type="time" class="form-control" [(ngModel)]="creaData.oraFine" />
          </div>
        </div>

        <p class="small text-muted mt-2 mb-0">Puoi salvare subito oppure inviare il permesso al dipendente per conferma.</p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        <button type="button" class="btn btn-light" (click)="savePermessoNoSend()" [disabled]="creaLoading">
          <span *ngIf="creaLoading" class="spinner-border spinner-border-sm me-1"></span> Salva
        </button>
        <button type="button" class="btn btn-primary" (click)="submitCreaPermesso()" [disabled]="creaLoading">
          <span *ngIf="creaLoading" class="spinner-border spinner-border-sm me-1"></span> Invia al dipendente
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Operazione completata.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Chiudi"></button>
    </div>
  </div>
</div>
