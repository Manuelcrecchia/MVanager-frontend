<div class="bg-light quotes-page">
  <header class="mv-entity-toolbar quotes-page-toolbar">
    <div class="mv-entity-toolbar__title">
      <h1>Preventivi</h1>
      <button type="button" class="btn mv-toolbar-back mv-mobile-home-back" (click)="back()">← Torna indietro</button>
      <button type="button"
        *ngIf="globalService.hasPermission('QUOTES_MANAGE')"
        class="btn mv-toolbar-primary"
        (click)="navigateToAddQuote()"
      >
        <i class="fas fa-plus me-1"></i> Nuovo
      </button>
    </div>
    <div class="mv-entity-toolbar__controls quote-toolbar-filters">
      <label class="quote-search-field">
        <span class="visually-hidden">Cerca preventivo</span>
        <i class="fas fa-search" aria-hidden="true"></i>
        <input
          class="form-control"
          type="search"
          [(ngModel)]="quoteSearch"
          (ngModelChange)="applyQuoteSearch()"
          placeholder="Numero preventivo, nominativo, email o telefono"
        />
      </label>
      <span class="mv-entity-toolbar__count">{{ quotesFrEnd.length }} / {{ totalQuotesCount }}</span>
      <button
        type="button"
        class="btn btn-light btn-sm"
        *ngIf="quoteSearch"
        (click)="clearQuoteSearch()"
      >
        Pulisci
      </button>
      <button type="button" class="btn btn-light btn-sm" (click)="toggleShowCompletedQuotes()">
        {{ showCompletedQuotes ? 'Nascondi archivio' : 'Mostra archivio' }}
      </button>
    </div>
  </header>

  <div class="container">
    <div class="row g-3">
    <div class="col-12" *ngFor="let quote of quotesFrEnd">
      <div
        class="quote-card"
        [class.quote-card--open]="isQuoteOpen(quote.numeroPreventivo)"
        [class.notification-target]="quote.numeroPreventivo === highlightedQuoteFromNotification"
        [attr.id]="'quote-' + quote.numeroPreventivo"
      >
        <div class="quote-header-layout">
          <button
            type="button"
            class="quote-header-btn"
            (click)="toggleQuoteOpen(quote.numeroPreventivo)"
          >
            <span class="quote-title">
            <span class="quote-num">#{{ quote.numeroPreventivo }}</span>
            <span class="quote-name">{{ getQuoteDisplayName(quote) }}</span>
            <span
              *ngIf="quote.acceptanceStatus === 'pending' && !isQuoteCompleted(quote)"
              class="badge bg-warning text-dark ms-2"
            >
              In attesa cliente
            </span>
            <span
              *ngIf="quote.signaturePresent"
              class="badge bg-info text-dark ms-2"
            >
              Firmato
            </span>
            <span
              *ngIf="quote.needsOfficeReview"
              class="badge bg-danger ms-2"
            >
              Da verificare
            </span>
            <span
              *ngIf="quote.officeConfirmedAt"
              class="badge bg-success ms-2"
            >
              Cliente creato
            </span>
            <ng-container *ngIf="isQuoteCompleted(quote)">
              <i *ngIf="quote.complete === 'A'" class="fas fa-check-circle text-success ms-2"></i>
              <i *ngIf="quote.complete === 'R'" class="fas fa-times-circle text-danger ms-2"></i>
            </ng-container>
            </span>
            <span class="chev" [class.chev--open]="isQuoteOpen(quote.numeroPreventivo)">▾</span>
          </button>
          <span class="d-flex align-items-center gap-2">
            <button
              type="button"
              class="btn btn-sm btn-pdf action-with-tooltip"
              (click)="viewPdf(quote); $event.stopPropagation()"
              title="Apri il PDF del preventivo"
              aria-label="Apri il PDF del preventivo"
              data-tooltip="Apre il PDF del preventivo"
            >
              <i class="fas fa-file-pdf"></i>
            </button>
            <button
              *ngIf="globalService.hasPermission('QUOTES_NOTES_VIEW')"
              type="button"
              class="btn btn-sm btn-notes action-with-tooltip mv-note-badge-anchor"
              (click)="navigateToNotes(quote.numeroPreventivo, getQuoteDisplayName(quote)); $event.stopPropagation()"
              title="Apri le note del preventivo"
              aria-label="Apri le note del preventivo"
              data-tooltip="Note del preventivo"
            >
              <i class="fas fa-note-sticky"></i>
              <span class="mv-note-unread-badge" *ngIf="noteUnread.count('quote', quote.numeroPreventivo) as unread">{{ unread > 99 ? '99+' : unread }}</span>
            </button>
          </span>
        </div>

        <div class="quote-actions mv-record-actions" *ngIf="isQuoteOpen(quote.numeroPreventivo)">
          <div class="quote-actions-inner mv-record-actions__inner">
            <button type="button"
              *ngIf="!isQuoteCompleted(quote) && globalService.hasPermission('QUOTES_MANAGE') && !quote.isLocked"
              class="btn btn-quote-action btn-quote-edit mv-record-action mv-record-action--edit action-with-tooltip"
              (click)="navigateToEditQuote(quote.numeroPreventivo)"
              title="Modifica il preventivo"
              aria-label="Modifica il preventivo"
              data-tooltip="Modifica preventivo"
            >
              <i class="fas fa-pen-to-square"></i>
            </button>

            <button type="button"
              *ngIf="globalService.hasPermission('QUOTES_MANAGE') && !quote.isLocked"
              class="btn btn-quote-action btn-quote-delete mv-record-action mv-record-action--danger action-with-tooltip"
              (click)="delete(quote.numeroPreventivo)"
              title="Elimina il preventivo"
              aria-label="Elimina il preventivo"
              data-tooltip="Elimina preventivo"
            >
              <i class="fas fa-trash"></i>
            </button>

            <button type="button"
              *ngIf="!isQuoteCompleted(quote)"
              class="btn btn-quote-action btn-quote-whatsapp mv-record-action mv-record-action--whatsapp action-with-tooltip"
              (click)="openQuoteWhatsApp(quote)"
              title="Apri la chat WhatsApp del cliente senza messaggio precompilato"
              aria-label="Apri WhatsApp"
              data-tooltip="Apri WhatsApp"
            >
              <i class="fab fa-whatsapp"></i>
            </button>

            <button type="button"
              *ngIf="!isQuoteCompleted(quote) && globalService.hasPermission('EMAIL_VIEW')"
              class="btn btn-quote-action btn-quote-email mv-record-action mv-record-action--email action-with-tooltip"
              (click)="composeQuoteEmail(quote)"
              title="Crea una nuova email con il cliente già come destinatario"
              aria-label="Scrivi email"
              data-tooltip="Scrivi email"
            >
              <i class="fas fa-envelope"></i>
            </button>

            <button type="button"
              *ngIf="!isQuoteCompleted(quote)"
              class="btn btn-quote-action btn-quote-chat mv-record-action mv-record-action--signature action-with-tooltip"
              (click)="sendAcceptanceLink(quote.numeroPreventivo)"
              title="Genera il link di accettazione e scegli WhatsApp o email"
              aria-label="Invia link accettazione"
              data-tooltip="Invia per accettazione"
            >
              <i class="fas fa-file-signature"></i>
            </button>

            <button type="button"
              *ngIf="quote.acceptanceStatus && globalService.hasPermission('QUOTES_VIEW')"
              class="btn btn-quote-action btn-quote-notes mv-record-action mv-record-action--evidence action-with-tooltip"
              (click)="showAcceptanceEvidence(quote.numeroPreventivo)"
              title="Visualizza i dati di prova dell'accettazione"
              aria-label="Dati prova firma"
              data-tooltip="Dati prova firma"
            >
              <i class="fas fa-shield-halved"></i>
            </button>



            <button type="button"
              *ngIf="!isQuoteCompleted(quote) && canCreateCalendarEvents()"
              class="btn btn-quote-action btn-quote-calendar mv-record-action mv-record-action--calendar action-with-tooltip"
              (click)="addInspection(quote.numeroPreventivo, getQuoteDisplayName(quote))"
              title="Crea un appuntamento in calendario da questo preventivo"
              aria-label="Crea appuntamento"
              data-tooltip="Crea appuntamento"
            >
              <i class="fas fa-calendar-alt"></i>
            </button>

            <button type="button"
              *ngIf="!isQuoteCompleted(quote) && !quote.isLocked"
              class="btn btn-quote-action btn-quote-confirm mv-record-action mv-record-action--confirm action-with-tooltip"
              (click)="conferm(quote.numeroPreventivo)"
              [title]="canCreateCustomersFromQuote() ? 'Conferma il preventivo e crea il cliente' : 'Segna il preventivo come accettato'"
              aria-label="Conferma preventivo"
              [attr.data-tooltip]="canCreateCustomersFromQuote() ? 'Conferma e crea cliente' : 'Accetta preventivo'"
            >
              <i class="fas fa-check"></i>
            </button>

            <button type="button"
              *ngIf="!isQuoteCompleted(quote) && (!quote.isLocked || quote.acceptanceStatus === 'pending')"
              class="btn btn-quote-action btn-quote-refuse mv-record-action mv-record-action--danger action-with-tooltip"
              (click)="refuse(quote.numeroPreventivo)"
              title="Segna il preventivo come rifiutato"
              aria-label="Rifiuta preventivo"
              data-tooltip="Rifiuta preventivo"
            >
              <i class="fas fa-times"></i>
            </button>

            <button type="button"
              *ngIf="quote.isLocked && globalService.hasPermission('QUOTES_MANAGE')"
              class="btn btn-quote-action btn-quote-copy mv-record-action mv-record-action--signature action-with-tooltip"
              (click)="duplicateQuote(quote.numeroPreventivo)"
              title="Duplica il preventivo bloccato in una nuova bozza modificabile"
              aria-label="Duplica preventivo"
              data-tooltip="Duplica preventivo"
            >
              <i class="fas fa-copy"></i>
            </button>

            <button type="button"
              *ngIf="isQuoteCompleted(quote) && quote.needsOfficeReview && canCreateCustomersFromQuote()"
              class="btn btn-quote-action btn-quote-verify mv-record-action mv-record-action--confirm action-with-tooltip"
              (click)="reviewSignedQuoteAndCreateCustomer(quote)"
              title="Apre il preventivo firmato; dopo la verifica puoi creare il cliente"
              aria-label="Verifica preventivo"
              data-tooltip="Verifica firmato"
            >
              <i class="fas fa-file-signature"></i>
            </button>

            <button type="button"
              *ngIf="isQuoteCompleted(quote) && !quote.needsOfficeReview"
              class="btn btn-quote-action btn-quote-restore mv-record-action mv-record-action--signature action-with-tooltip"
              (click)="restore(quote.numeroPreventivo)"
              title="Riporta il preventivo tra quelli aperti"
              aria-label="Ripristina preventivo"
              data-tooltip="Ripristina preventivo"
            >
              <i class="fas fa-undo"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>
