<div class="standard-management-page">
  <header class="mv-entity-toolbar"><div class="mv-entity-toolbar__title"><h1>Gestione assenze</h1></div><div class="mv-entity-toolbar__controls"><button type="button" class="btn mv-toolbar-back" (click)="goBack()">← Torna indietro</button></div></header>
  <div class="container">
  <!-- Nessun dipendente selezionato -->
  <div *ngIf="!employeeId" class="alert alert-warning text-center text-dark">
    Nessun dipendente selezionato.
  </div>

  <!-- Selezionato -->
  <div *ngIf="employeeId">
    <table class="table table-hover align-middle text-center shadow-sm rounded">
      <thead class="table-light">
        <tr>
          <th>Dal</th>
          <th>Al</th>
          <th>Motivo</th>
          <th>Ore/Giorno</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        <!-- 🔁 Assenze esistenti -->
        <tr *ngFor="let a of assenze">
          <td data-label="Dal">
            <input
              type="date"
              [(ngModel)]="a.dataInizio"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Al">
            <input
              type="date"
              [(ngModel)]="a.dataFine"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Motivo">
            <select
              [(ngModel)]="a.categoria"
              class="form-select rounded-pill text-center"
            >
              <option *ngFor="let cat of categorie" [value]="cat">
                {{ cat }}
              </option>
            </select>
          </td>
          <td data-label="Ore/Giorno">
            <input
              type="number"
              step="0.5"
              [(ngModel)]="a.oreGiornaliere"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Azioni">
            <button type="button"
              class="btn btn-success rounded-pill btn-sm me-2"
              (click)="updateAssenza(a)"
              title="Salva"
            >
              <i class="fas fa-save"></i>
            </button>
            <button type="button"
              class="btn btn-danger rounded-pill btn-sm"
              (click)="deleteAssenza(a.id)"
              title="Elimina"
            >
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>

        <!-- ➕ Nuova assenza -->
        <tr class="bg-light">
          <td data-label="Dal">
            <input
              type="date"
              [(ngModel)]="nuovaAssenza.dataInizio"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Al">
            <input
              type="date"
              [(ngModel)]="nuovaAssenza.dataFine"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Motivo">
            <select
              [(ngModel)]="nuovaAssenza.categoria"
              class="form-select rounded-pill text-center"
            >
              <option value="" disabled selected>Seleziona...</option>
              <option *ngFor="let cat of categorie" [value]="cat">
                {{ cat }}
              </option>
            </select>
          </td>
          <td data-label="Ore/Giorno">
            <input
              type="number"
              step="0.5"
              [(ngModel)]="nuovaAssenza.oreGiornaliere"
              class="form-control rounded-pill text-center"
            />
          </td>
          <td data-label="Azioni">
            <button type="button"
              class="btn btn-pink rounded-pill btn-sm"
              (click)="addAssenza()"
              title="Aggiungi"
            >
              <i class="fas fa-plus"></i> Aggiungi
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Nessuna assenza -->
    <div *ngIf="assenze.length === 0" class="alert alert-info text-center mt-3">
      Nessuna assenza registrata per questo dipendente.
    </div>
  </div>
</div>
</div>
