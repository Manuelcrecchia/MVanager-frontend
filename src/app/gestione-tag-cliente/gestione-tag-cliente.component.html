<div class="standard-management-page customer-tag-page">
  <header class="mv-entity-toolbar">
    <div class="mv-entity-toolbar__title"><h1>Gestione posizione tag</h1></div>
    <div class="mv-entity-toolbar__controls"><button type="button" class="btn mv-toolbar-back" routerLink="/listCustomer">← Torna indietro</button></div>
  </header>

  <div class="container customer-tag-content">

  <div class="card p-4 shadow-sm">
    <label class="form-label fw-bold">Posizione Tag</label>
    <textarea
      class="form-control mb-3"
      [(ngModel)]="posizioneTag"
      rows="3"
    ></textarea>

    <label class="form-label fw-bold">Immagine Posizione</label>

    <div class="mb-3">
      <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)"
      />
    </div>

    <div *ngIf="immagineAttuale" class="mb-3">
      <p>Immagine attuale:</p>
      <img
        [src]="immagineAttuale"
        class="img-fluid rounded"
        style="max-width: 250px"
      />
    </div>

    <button type="button" class="btn mv-toolbar-primary" (click)="salva()">
      Salva
    </button>
  </div>
  </div>
</div>
