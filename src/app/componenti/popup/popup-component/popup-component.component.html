<div class="app-alert" [ngClass]="'app-alert-' + type">
  <div class="app-alert-icon">
    <mat-icon *ngIf="type === 'error'">error_outline</mat-icon>
    <mat-icon *ngIf="type === 'warning'">warning_amber</mat-icon>
    <mat-icon *ngIf="type === 'success'">check_circle_outline</mat-icon>
    <mat-icon *ngIf="type === 'info'">info_outline</mat-icon>
  </div>

  <h2 mat-dialog-title>{{ title }}</h2>

  <div mat-dialog-content>
    <ng-container *ngIf="detailLines.length; else singleMessage">
      <div class="app-alert-message">
        <p class="app-alert-lead">{{ headline }}</p>
        <p *ngFor="let line of detailLines">{{ line }}</p>
      </div>
    </ng-container>

    <ng-template #singleMessage>
      <p>{{ text }}</p>
    </ng-template>

    <label class="app-alert-input" *ngIf="data.mode === 'prompt'">
      <span>{{ data.inputLabel }}</span>
      <input
        [(ngModel)]="inputValue"
        [type]="data.inputType || 'text'"
        (keydown.enter)="confirm()"
      />
    </label>
  </div>

  <div mat-dialog-actions align="end">
    <button
      type="button"
      mat-button
      class="app-alert-cancel"
      *ngIf="data.mode !== 'alert'"
      (click)="cancel()"
    >
      {{ data.cancelLabel }}
    </button>
    <button type="button" mat-button class="app-alert-button" (click)="confirm()">
      {{ data.confirmLabel }}
    </button>
  </div>
</div>
